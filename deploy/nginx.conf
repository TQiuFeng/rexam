# rexam 生产环境 nginx 配置示例
#
# 一台 nginx 前置，后面挂 N 个 rexam 节点。节点之间完全对等（无状态），
# 共享同一套 PostgreSQL 和 Redis，加机器只需要往 upstream 里加一行。
#
# 放到 /etc/nginx/conf.d/rexam.conf，改掉 server_name、证书路径和 upstream 地址。

upstream rexam_backend {
    # 按最少连接数分发，比轮询更适合有长短不一请求的场景
    least_conn;

    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    # 加节点就往下加，注意每个节点的 .env 要指向同一套数据库和 Redis
    # server 10.0.0.12:8080 max_fails=3 fail_timeout=10s;
    # server 10.0.0.13:8080 max_fails=3 fail_timeout=10s;

    keepalive 64;
}

# 机位绑定接口按 IP 限速，防止有人拿考场码爆破座位号
limit_req_zone $binary_remote_addr zone=seat_bind:10m rate=10r/m;
# 登录接口同理
limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;

server {
    listen 80;
    server_name exam.example.com;
    # 考试系统涉及身份和成绩，生产环境务必上 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name exam.example.com;

    ssl_certificate     /etc/nginx/ssl/exam.crt;
    ssl_certificate_key /etc/nginx/ssl/exam.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 考生可能提交较长的简答，后端限制单题 64KB，这里给足余量
    client_max_body_size 4m;

    # ---------- 前端静态资源 ----------
    root /var/www/rexam;
    index index.html;

    # 带 hash 的构建产物可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # history 模式路由，未命中的路径一律回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 本身不能缓存，否则发版后客户端拿不到新的 assets 引用
        add_header Cache-Control "no-cache";
    }

    # ---------- 后端接口 ----------
    location /api/ {
        proxy_pass http://rexam_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 交卷洪峰时后端要做刷盘和判分，留足超时
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 某个节点挂了就换一台重试，考生无感
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location = /api/seat/bind {
        limit_req zone=seat_bind burst=5 nodelay;
        proxy_pass http://rexam_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/auth/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://rexam_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 健康检查，不写访问日志
    location = /healthz {
        proxy_pass http://rexam_backend;
        access_log off;
    }
}
